<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Extralite Korea</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/hyperstem, /en/brompton ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/extralite/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/extralite/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'stem':'cockpit', 'stems':'cockpit', 'hyperstem':'cockpit', 'hyperstealth':'cockpit', 'bar':'cockpit', 'bars':'cockpit', 'handlebar':'cockpit', 'headset':'cockpit', 'headsets':'cockpit', 'saddle':'cockpit', 'ch-02':'cockpit',
                'hub':'hubs', 'hypersmart':'hubs', 'hyperboost':'hubs', 'hyperv3':'hubs', 'cyber':'hubs', 'spd':'hubs',
                'wheel':'wheels', 'wheelset':'wheels', 'wheelsets':'wheels', 'cyberdisc':'wheels', 'cyberclimb':'wheels', 'hypergravel':'wheels', 'carbocamber':'wheels', 'hyperterra':'wheels',
                'cybercity':'brompton', '349b':'brompton', 'qrc3s-b':'brompton', 'brompton-wheels':'brompton',
                'crank':'drivetrain', 'cranks':'drivetrain', 'qrc':'drivetrain', 'qrc-3s':'drivetrain', 'chainring':'drivetrain', 'octaphase':'drivetrain', 'bb':'drivetrain', 'hyperbb':'drivetrain', 'pulley':'drivetrain', 'ultrapulley':'drivetrain', 'axle':'drivetrain', 'blacklock':'drivetrain', 'aliens':'drivetrain', 'frame':'drivetrain', 'frames':'drivetrain',
                'compatibility':'fit', 'fit-guide':'fit', 'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'dealers', 'lineup':'range' };
  var map = { brand:1, range:1, cockpit:1, hubs:1, wheels:1, brompton:1, drivetrain:1, fit:1, story:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
